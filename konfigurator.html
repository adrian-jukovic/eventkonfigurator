<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventkonfigurator – Jukert Party &amp; Eventservice</title>
  <style>
    html, body { margin: 0; background: #0c1424; }
    .back-link {
      display: inline-block; margin: 16px 0 0 16px;
      font-family: Arial, sans-serif; font-size: .9rem;
      color: #a9b0c0; text-decoration: none;
    }
    .back-link:hover { color: #ff8a3d; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Zurück zur Startseite</a>
  <div id="app"></div>
  <script>
    fetch('eventkonfigurator.html?_=' + Date.now())
      .then(r => r.text())
      .then(html => {
        const container = document.getElementById('app');
        container.innerHTML = html;
        container.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          if (old.src) s.src = old.src; else s.textContent = old.textContent;
          old.replaceWith(s);
        });
      });
  </script>
</body>
</html>
